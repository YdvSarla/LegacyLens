acme_reports.list:
  path: '/admin/reports/acme'
  defaults:
    _controller: '\Drupal\acme_reports\Controller\ReportController::list'
    _title: 'Reports'
  requirements:
    _permission: 'view acme reports'
acme_reports.settings:
  path: '/admin/config/acme'
  methods: [GET, POST]
  defaults:
    _form: '\Drupal\acme_reports\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'
