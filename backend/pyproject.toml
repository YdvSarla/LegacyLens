[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-q --strict-markers"
markers = ["docker: needs a Docker daemon and the sandbox images (make sandbox-images)"]
filterwarnings = ["ignore::DeprecationWarning:faiss.*", "ignore::DeprecationWarning:swigfaiss.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008",  # FastAPI dependencies in defaults.
  "S101",  # Asserts are fine in tests, and in one reader thread check.
  "S603",  # Commands use argument lists and never a shell.
  "S607",  # git and docker come from PATH on purpose.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S105", "S106", "S108", "S113", "S608"]
"app/core/config.py" = ["S105"]
"app/core/security.py" = ["S105"]
